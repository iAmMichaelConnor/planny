name: Publish to npm

# Manual trigger only. Needs the NPM_TOKEN repository secret (added by the
# operator from their own browser — the token never touches a dev machine).
# After the first published version, configure npm trusted publishing for
# this repo+workflow and delete the token; provenance is already enabled.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
