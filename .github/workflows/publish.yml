name: Publish to npm

# Manual trigger only. Auth is npm trusted publishing (OIDC): npmjs.com
# trusts this exact repo + workflow file, so no token or secret exists
# anywhere. Trusted publishing needs npm >= 11.5.1, hence Node 24 here.
# Provenance is generated automatically on the OIDC path.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC exchange with npmjs.com

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
