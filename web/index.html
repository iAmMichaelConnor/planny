<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planny</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">😎</text></svg>'>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="header-main">
  <h1>planny</h1>
  <input id="search" type="search" placeholder="t23 ⏎"
    title="Type a task id (t23, or just 23) and press Enter to open it" />
  <button id="theme-btn" title="theme: auto">🌓</button>
  <nav id="tabs">
    <button class="tab active" data-view="board">Board</button>
    <button class="tab" data-view="tree">Tree</button>
    <button class="tab" data-view="deps">Dependencies</button>
    <button class="tab" data-view="decisions">Decisions <span id="decision-count"></span></button>
  </nav>
  <button id="add-btn" class="primary">+ Add task</button>
  </div>
  <div class="header-sub">
    <span id="store-label" class="muted"></span>
    <div id="progress-wrap" title="done / all non-cancelled tasks">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text"></span>
    </div>
  </div>
</header>

<main>
  <section id="view-board" class="view">
    <div id="board-filters" class="filters"></div>
    <div id="board-columns"></div>
  </section>

  <section id="view-tree" class="view hidden">
    <div id="tree-filters" class="filters"></div>
    <div id="tree-list"></div>
  </section>

  <section id="view-deps" class="view hidden">
    <div class="filters">
      <label>arrows read:
        <select id="deps-mode">
          <option value="blocks">A → B: A blocks B</option>
          <option value="blocked-by">A → B: A is blocked by B</option>
        </select>
      </label>
      <span class="chip-group legend" id="deps-status"></span>
    </div>
    <p class="hint" id="deps-hint"></p>
    <div id="deps-scroll"><svg id="deps-svg"></svg></div>
  </section>

  <section id="view-decisions" class="view hidden"></section>
</main>

<aside id="drawer" class="hidden">
  <div id="drawer-resize" title="drag to resize"></div>
  <div id="drawer-head">
    <span id="drawer-title"></span>
    <span id="drawer-controls">
      <button class="dock-btn" data-dock="left" title="dock left">◧</button>
      <button class="dock-btn" data-dock="bottom" title="dock bottom">⬓</button>
      <button class="dock-btn" data-dock="right" title="dock right">◨</button>
      <button id="drawer-close" title="close">×</button>
    </span>
  </div>
  <div id="drawer-body"></div>
</aside>

<div id="add-note" class="hidden">
  <div class="modal">
    <p><strong>Good call using the button.</strong> Adding a task by hand here is
    deterministic and spends no AI tokens — the form writes straight to the
    store, attributed to <code>operator</code>. Ask your agent instead when the
    task needs a rich description, relationships, or a place in the plan.</p>
    <div class="row">
      <button id="add-note-continue" class="primary">Continue</button>
      <button id="add-note-dismiss">Continue, don't show this again</button>
    </div>
  </div>
</div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
